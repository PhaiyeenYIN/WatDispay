  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
    html, body { width: 100vw; height: 100vh; background-color: #ffffff; }

    .iframe-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    iframe {
      border: none;
      /* Set an explicit virtual width wide enough to render A to AR without cutting off */
      width: 2500px;
      height: 1400px;
      
      /* Scale the 2500px canvas down to fit a standard 1920x1080 Full HD TV */
      transform: scale(0.76); 
      transform-origin: top left;
    }
  </style>

  <meta http-equiv="refresh" content="60">
