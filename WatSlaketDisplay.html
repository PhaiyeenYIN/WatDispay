<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Attendance Dashboard</title>
  <!-- Automatically reloads every 60 seconds to pull live checkbox edits -->
  <meta http-equiv="refresh" content="60">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
    }

    iframe {
      border: none;
      /* Generates a virtual canvas wide enough to render Columns A to AR without cutting off */
      width: 2500px;
      height: 1400px;

      /* Automatically scales down the 2500px canvas to fit 1920x1080 Full HD (1920 / 2500 = ~0.768) */
      transform: scale(0.768);
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRiYd1k_b0xS3zBIPPeoVRdiVoi4gxS3IwWsua3M39ofI_ocmOlIUtFbNVf4aNNe9EQxv3U5571Y4Uc/pubhtml?gid=713619322&single=true&chrome=false"></iframe>
  </div>
</body>
</html>
