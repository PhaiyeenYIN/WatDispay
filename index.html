<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Attendance Dashboard</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    iframe {
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      /* Extended canvas to render all 44 columns through AR */
      width: 6200px;
      height: 2500px;

      /* Scales the 6200px table down to fit 100% of your screen width */
      transform: scale(calc(100vw / 6200));
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe id="sheetFrame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRiYd1k_b0xS3zBIPPeoVRdiVoi4gxS3IwWsua3M39ofI_ocmOlIUtFbNVf4aNNe9EQxv3U5571Y4Uc/pubhtml?gid=713619322&single=true&chrome=false"></iframe>
  </div>

  <script>
    const baseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRiYd1k_b0xS3zBIPPeoVRdiVoi4gxS3IwWsua3M39ofI_ocmOlIUtFbNVf4aNNe9EQxv3U5571Y4Uc/pubhtml?gid=713619322&single=true&chrome=false";
    const frame = document.getElementById("sheetFrame");

    // Force real-time reload every 30 seconds
    setInterval(() => {
      frame.src = baseUrl + "&_t=" + Date.now();
    }, 30000);
  </script>
</body>
</html>
