<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Attendance Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      overflow: hidden;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    iframe {
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      /* Generates a virtual canvas wide enough to fit columns A to AR */
      width: 3200px;
      height: 1600px;

      /* Automatically scales the width down to match the exact TV screen width */
      transform: scale(calc(100vw / 3200));
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe id="sheetFrame" src="PASTE_YOUR_PUBLISHED_URL_HERE&chrome=false"></iframe>
  </div>

  <script>
    const baseUrl = "PASTE_YOUR_PUBLISHED_URL_HERE&chrome=false";
    const iframe = document.getElementById("sheetFrame");

    // Force-refreshes the iframe every 60 seconds with a unique timestamp to break Google's cache
    setInterval(() => {
      const cacheBuster = "&_cb=" + new Date().getTime();
      iframe.src = baseUrl + cacheBuster;
    }, 60000);
  </script>
</body>
</html>
